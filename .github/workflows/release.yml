name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0, leave empty to use package.json)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Code quality & type checks
        run: |
          npm run check
          node --check public/app.js

      - name: Run test suite
        run: npm test

      - name: Align package.json version with release tag
        id: release_version
        run: |
          TAG_NAME="${{ github.event.release.tag_name || inputs.version }}"
          if [ -n "$TAG_NAME" ]; then
            VERSION="${TAG_NAME#v}"
            echo "Target publish version: $VERSION"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "Using package.json version: $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package & pre-publish smoke test
        id: pack
        run: |
          npm pack
          TARBALL=$(ls -1 *.tgz | tail -n 1)
          echo "Generated tarball: $TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          node scripts/package-smoke.mjs "$TARBALL"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public --provenance

      - name: Post-publish install smoke test
        run: |
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          npm init -y
          # Verify execution via npm exec / npx from npmjs (with fallback to local tarball in dry-run/timing windows)
          echo "Testing agenttime command execution..."
          npx --yes "@ccclucky/agent-time@${{ steps.release_version.outputs.version }}" --help || \
          npx --yes --package "$GITHUB_WORKSPACE/${{ steps.pack.outputs.tarball }}" -- agenttime --help
