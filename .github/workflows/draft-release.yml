name: Draft Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  update-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Tag selection and note aggregation live in scripts/draft-release.mjs so
      # they can be unit tested (tests/draft_release.test.ts). A draft pointing
      # at an already-published tag is retagged onto the next patch version
      # instead of creating a duplicate "v0.2.1 (Pending Release)".
      - name: Update or Create Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/draft-release.mjs
