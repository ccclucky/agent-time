name: Draft Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  update-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update or Create Draft Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // 1. Read current version from package.json
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const defaultTag = `v${pkg.version}`;

            // 2. Locate merged PR associated with current commit
            let releaseNoteLines = [];
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            if (pulls && pulls.length > 0) {
              const pr = pulls[0];
              const body = pr.body || '';
              const match = body.match(/###\s*Release Notes\s*([\s\S]*?)(?=###|$)/i);
              if (match) {
                const raw = match[1].trim();
                if (raw && raw.toLowerCase() !== 'none') {
                  const lines = raw.split('\n')
                    .map(l => l.trim())
                    .filter(l => l.length > 0 && l.startsWith('-'))
                    .map(l => `${l} (by @${pr.user.login} in #${pr.number})`);
                  if (lines.length > 0) {
                    releaseNoteLines.push(...lines);
                  }
                }
              }
              // Fallback to PR title if no specific bullet points were provided
              if (releaseNoteLines.length === 0) {
                releaseNoteLines.push(`- ${pr.title} (#${pr.number}) by @${pr.user.login}`);
              }
            } else {
              // Direct commit fallback
              const headCommit = context.payload.head_commit;
              if (headCommit) {
                const title = headCommit.message.split('\n')[0].trim();
                // Exclude chore/merge commits from polluting release notes if possible
                if (!title.startsWith('Merge ')) {
                  releaseNoteLines.push(`- ${title} (${context.sha.substring(0, 7)})`);
                }
              }
            }

            if (releaseNoteLines.length === 0) {
              console.log('No release note entries found for this push.');
              return;
            }

            const newContent = releaseNoteLines.join('\n');
            console.log('Discovered release notes:\n' + newContent);

            // 3. Find existing draft release or create a new one
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 30,
            });

            const draft = releases.find(r => r.draft);

            if (draft) {
              // Avoid duplicate appends
              const existingBody = draft.body || '';
              if (existingBody.includes(newContent)) {
                console.log('Notes already present in draft release. Skipping.');
                return;
              }
              const updatedBody = existingBody
                ? `${existingBody}\n${newContent}`
                : `## What's Changed\n\n${newContent}`;

              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draft.id,
                body: updatedBody,
              });
              console.log(`Updated draft release #${draft.id} (${draft.tag_name})`);
            } else {
              const body = `## What's Changed\n\n${newContent}\n\n---\n*Click 'Publish release' when ready to deploy this version to npm.*`;
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: defaultTag,
                name: `${defaultTag} (Pending Release)`,
                draft: true,
                prerelease: false,
                body: body,
              });
              console.log(`Created new draft release #${created.data.id} with tag ${defaultTag}`);
            }
