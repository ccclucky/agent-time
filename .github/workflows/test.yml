name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # 22.15.0 is the engines floor and the first Node with the zstd API:
        # keeping it in the matrix stops the zstd-backed suites (Codex .zst,
        # DSH multi-frame) from silently skipping in CI.
        node: ["22.15.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node --check public/app.js
      # Builds dist and asserts the two things a first-run user sees:
      # `--version` equals package.json, and stderr is free of the node:sqlite
      # ExperimentalWarning. Regression gate for src/version.ts + src/warnings.ts.
      - run: npm run build
      - run: node scripts/check-cli.mjs
      - run: npm pack
      - run: node scripts/package-smoke.mjs
