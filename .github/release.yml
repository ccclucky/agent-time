changelog:
  categories:
    - title: "🚀 Features"
      labels:
        - "feature"
        - "enhancement"
        - "feat"
    - title: "🐛 Bug Fixes"
      labels:
        - "fix"
        - "bug"
    - title: "⚡ Performance Improvements"
      labels:
        - "perf"
        - "performance"
    - title: "🧰 Maintenance & Dependencies"
      labels:
        - "chore"
        - "dependencies"
        - "docs"
