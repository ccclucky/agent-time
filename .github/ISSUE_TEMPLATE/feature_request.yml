name: 功能建议 / Feature request
description: 新 harness 接入、口径改进或界面想法 / New adapter, timing refinement, or UI idea
labels: ["enhancement", "needs-triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 类别 / Area
      options:
        - 新 harness 接入 / new harness adapter
        - 计时口径 / timing semantics
        - 前端界面 / frontend UI
        - 文档 / docs
        - 其他 / other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
      description: 先讲场景与缺口，再讲方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想 / Proposed solution
